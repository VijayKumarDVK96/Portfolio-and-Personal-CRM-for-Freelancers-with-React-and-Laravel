services:
  vijaykumardvk_app:
    image: website_vijaykumardvk:latest
    container_name: vijaykumardvk_app
    restart: unless-stopped
    working_dir: /var/www/vijaykumardvk
    networks:
      - shared-network
    volumes:
      - vijaykumardvk:/var/www/vijaykumardvk

  vijaykumardvk_web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: vijaykumardvk_web
    restart: unless-stopped
    networks:
      - shared-network
    volumes:
      - vijaykumardvk:/var/www/vijaykumardvk
    depends_on:
      - vijaykumardvk_app

networks:
  shared-network:
    external: true

volumes:
  vijaykumardvk: