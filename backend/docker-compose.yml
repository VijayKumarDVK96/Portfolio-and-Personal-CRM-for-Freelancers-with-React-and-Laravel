services:
  website_vijaykumardvk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: website_vijaykumardvk
    restart: unless-stopped
    working_dir: /var/www/vijaykumardvk
    env_file:
      - .env.production
    volumes:
      - C:/xampp/htdocs/Portfolio-and-Personal-CRM-for-Freelancers-with-React-and-Laravel/backend:/var/www/vijaykumardvk
    expose:
      - "9000"
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: shared-network