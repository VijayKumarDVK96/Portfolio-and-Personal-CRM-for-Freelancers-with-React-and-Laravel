server {
    listen 80;
    server_name vijaykumardvk.duckdns.org www.vijaykumardvk.duckdns.org;
    root /var/www/vijaykumardvk/public;

    index index.php index.html index.htm;

    charset utf-8;

    # Logging
    access_log /var/log/nginx/vijaykumardvk-access.log;
    error_log /var/log/nginx/vijaykumardvk-error.log;

    # Main location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Don't log favicon and robots
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt  {
        access_log off;
        log_not_found off;
    }

    # Handle 404 errors
    error_page 404 /index.php;

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass vijaykumardvk_app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeouts
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;

        fastcgi_param HTTPS on;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}